<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FINAL WORKING CHART</title>
    <!-- Stable Library Link -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0e11; color: white; overflow: hidden; font-family: sans-serif; }
        #log-screen { position: absolute; top: 0; left: 0; width: 100%; height: 50px; background: rgba(0,0,0,0.8); font-size: 10px; z-index: 100; overflow-y: auto; padding: 5px; color: #00ff00; border-bottom: 1px solid #333; }
        #chart-box { width: 100vw; height: calc(100vh - 50px); margin-top: 50px; }
        .err { color: #ff3355 !important; }
    </style>
</head>
<body>

<div id="log-screen">Initializing... Please wait.</div>
<div id="chart-box"></div>

<script>
    const logArea = document.getElementById('log-screen');
    const chartBox = document.getElementById('chart-box');

    function writeLog(text, isError = false) {
        const time = new Date().toLocaleTimeString();
        logArea.innerHTML = `<span class="${isError ? 'err' : ''}">[${time}] ${text}</span><br>` + logArea.innerHTML;
    }

    // 1. Check if Library Loaded
    if (typeof LightweightCharts === 'undefined') {
        writeLog("ERROR: Chart Library not loaded! Check internet.", true);
    } else {
        writeLog("Library Loaded Successfully.");
        
        // 2. Create Chart
        try {
            const chart = LightweightCharts.createChart(chartBox, {
                layout: { background: { color: '#0b0e11' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#1f2226' }, horzLines: { color: '#1f2226' } },
                width: chartBox.clientWidth,
                height: chartBox.clientHeight,
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            const candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350',
                borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            writeLog("Chart Container Created.");

            // 3. Connect WebSocket
            const ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            ws.onopen = () => {
                writeLog("Connected to Deriv API.");
                ws.send(JSON.stringify({
                    ticks_history: "R_100",
                    adjust_start_time: 1,
                    count: 500,
                    end: "latest",
                    granularity: 60,
                    style: "candles",
                    subscribe: 1
                }));
            };

            ws.onmessage = (msg) => {
                const data = JSON.parse(msg.data);
                
                if (data.msg_type === 'ticks_history') {
                    writeLog("History Loaded: " + data.candles.length + " bars.");
                    const bars = data.candles.map(c => ({
                        time: c.epoch,
                        open: parseFloat(c.open),
                        high: parseFloat(c.high),
                        low: parseFloat(c.low),
                        close: parseFloat(c.close)
                    }));
                    candleSeries.setData(bars);
                }

                if (data.msg_type === 'ohlc') {
                    candleSeries.update({
                        time: parseInt(data.ohlc.open_time),
                        open: parseFloat(data.ohlc.open),
                        high: parseFloat(data.ohlc.high),
                        low: parseFloat(data.ohlc.low),
                        close: parseFloat(data.ohlc.close)
                    });
                }
            };

            ws.onerror = () => writeLog("WebSocket Connection Error!", true);
            ws.onclose = () => writeLog("Connection Closed.", true);

            // Resize handle
            window.onresize = () => {
                chart.applyOptions({ width: chartBox.clientWidth, height: chartBox.clientHeight });
            };

        } catch (e) {
            writeLog("Chart Init Error: " + e.message, true);
        }
    }
</script>
</body>
</html>
