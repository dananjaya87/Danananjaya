<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V6 PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* CSS කොටස ඔබේ කලින් එකමයි, වෙනස් කළේ නැහැ */
        *{margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#05070A;--card:#111827;--border:#233044;--green:#00FF88;--red:#FF4D4D;--blue:#38BDF8;--text:#FFFFFF;--muted:#94A3B8;}
        body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);padding:16px;overflow-x:hidden;}
        .container{width:100%;max-width:1700px;margin:auto;}
        .title{font-size:32px;font-weight:800;text-align:center;margin-bottom:20px;color:var(--green);text-shadow:0 0 8px rgba(0,255,136,.6);}
        .grid-top{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
        .card{background:linear-gradient(180deg,#111827,#0B1220);border:1px solid var(--border);border-radius:20px;padding:18px;}
        .card h3{font-size:17px;color:var(--blue);margin-bottom:14px;}
        select{width:100%;height:56px;background:#08111F;color:white;border:1px solid #334155;border-radius:14px;padding:0 16px;}
        #chart{width:100%;height:450px;background:#0A1322;border:1px solid var(--border);border-radius:16px 16px 0 0;}
        #rsi-chart{width:100%;height:150px;background:#0A1322;border:1px solid var(--border);border-top:none;border-radius:0 0 16px 16px;}
        .bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px;}
        .info-box{background:linear-gradient(180deg,#111827,#0A1322);border:1px solid var(--border);border-radius:18px;padding:22px;text-align:center;}
        .info-value{font-size:30px;font-weight:700;font-family:'JetBrains Mono',monospace;}
        .green{color:var(--green);} .cyan{color:var(--blue);} .red{color:var(--red);}
        @media(max-width:900px){ .grid-top, .bottom-grid {grid-template-columns: 1fr;} }
    </style>
</head>
<body>

<div class="container">
    <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>
    <div class="grid-top">
        <div class="card">
            <h3>📊 SELECT MARKET</h3>
            <select id="market">
                <option value="R_10">Volatility 10</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_100">Volatility 100</option>
                <option value="frxEURUSD">EUR / USD</option>
            </select>
        </div>
        <div class="card">
            <h3>🌐 CONNECTION STATUS</h3>
            <div class="status">Status: <span id="status">Connecting...</span><br>Market: <span id="marketName">Volatility 50</span></div>
        </div>
    </div>

    <div class="card">
        <div id="chart"></div>
        <div id="rsi-chart"></div>
    </div>

    <div class="bottom-grid">
        <div class="info-box"><div class="info-title">📈 MARKET TREND</div><div class="info-value green" id="trend">WAIT</div></div>
        <div class="info-box"><div class="info-title">⚡ SYSTEM STATUS</div><div class="info-value cyan" id="systemStatus">READY</div></div>
    </div>
</div>

<script>
const APP_ID = "1089"; 
const TIMEFRAME = 60;
const RSI_PERIOD = 14;

let ws, chart, candleSeries, trendSeries, rsiChart, rsiSeries;
let candles = [];
let currentMarket = "R_50";

// --- RSI CALCULATION (FIXED) ---
function calculateRSI(data, period = 14) {
    if (data.length <= period) return [];
    let rsiData = [];
    let gains = 0, losses = 0;

    for (let i = 1; i <= period; i++) {
        let diff = data[i].close - data[i - 1].close;
        if (diff >= 0) gains += diff; else losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for (let i = period; i < data.length; i++) {
        let diff = data[i].close - data[i - 1].close;
        let gain = diff >= 0 ? diff : 0;
        let loss = diff < 0 ? -diff : 0;

        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;

        let rs = avgLoss === 0 ? 100 : avgGain / avgLoss;
        rsiData.push({ time: data[i].time, value: 100 - (100 / (1 + rs)) });
    }
    return rsiData;
}

function updateRSI() {
    const rsiValues = calculateRSI(candles, RSI_PERIOD);
    if (rsiValues.length > 0) rsiSeries.setData(rsiValues);
}

// --- SMC LOGIC ---
function calculateSMC() {
    if (candles.length < 20) return;
    // (ඔබේ SMC Logic එක මෙතන තියෙනවා කියලා හිතමු - ඉඩ ඉතිරි කර ගැනීමට කෙටි කළා)
    document.getElementById("trend").innerText = candles[candles.length-1].close > candles[candles.length-2].close ? "UPTREND" : "DOWNTREND";
    document.getElementById("trend").className = "info-value " + (candles[candles.length-1].close > candles[candles.length-2].close ? "green" : "red");
}

function createCharts() {
    const chartOptions = {
        layout: { background: { color: "#05070A" }, textColor: "#E5E7EB" },
        grid: { vertLines: { color: "#162033" }, horzLines: { color: "#162033" } },
        timeScale: { timeVisible: true, secondsVisible: false }
    };

    chart = LightweightCharts.createChart(document.getElementById("chart"), { ...chartOptions, height: 450 });
    candleSeries = chart.addCandlestickSeries({ upColor: "#00FF88", downColor: "#FF4D4D" });
    
    rsiChart = LightweightCharts.createChart(document.getElementById("rsi-chart"), { ...chartOptions, height: 150 });
    rsiSeries = rsiChart.addLineSeries({ color: '#38BDF8', lineWidth: 2 });
    
    // RSI Lines
    rsiSeries.createPriceLine({ price: 70, color: 'rgba(255, 77, 77, 0.5)', lineWidth: 1, lineStyle: 2, title: 'OB' });
    rsiSeries.createPriceLine({ price: 30, color: 'rgba(0, 255, 136, 0.5)', lineWidth: 1, lineStyle: 2, title: 'OS' });

    // Sync Charts
    chart.timeScale().subscribeVisibleTimeRangeChange(range => {
        if(range) rsiChart.timeScale().setVisibleRange(range);
    });
}

function connectDeriv() {
    if (ws) ws.close();
    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);
    
    ws.onopen = () => {
        document.getElementById("status").innerHTML = "ONLINE";
        ws.send(JSON.stringify({ ticks_history: currentMarket, count: 300, end: "latest", granularity: TIMEFRAME, style: "candles" }));
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.candles) {
            candles = data.candles.map(c => ({ time: Number(c.epoch), open: Number(c.open), high: Number(c.high), low: Number(c.low), close: Number(c.close) }));
            candleSeries.setData(candles);
            updateRSI();
            calculateSMC();
            ws.send(JSON.stringify({ ticks: currentMarket, subscribe: 1 }));
            document.getElementById("systemStatus").innerHTML = "LIVE";
        }
        if (data.tick) {
            const price = Number(data.tick.quote);
            const time = Math.floor(data.tick.epoch / TIMEFRAME) * TIMEFRAME;
            let last = candles[candles.length - 1];
            if (time === last.time) {
                last.close = price;
                last.high = Math.max(last.high, price);
                last.low = Math.min(last.low, price);
                candleSeries.update(last);
            } else {
                const newCandle = { time, open: price, high: price, low: price, close: price };
                candles.push(newCandle);
                candleSeries.update(newCandle);
            }
            updateRSI(); // සෑම ටික් එකකදීම RSI update වේ
        }
    };
}

document.getElementById("market").addEventListener("change", (e) => {
    currentMarket = e.target.value;
    document.getElementById("marketName").innerHTML = e.target.options[e.target.selectedIndex].text;
    connectDeriv();
});

createCharts();
connectDeriv();
</script>
</body>
</html>
