<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMC Chart Dashboard - Deriv</title>
    <!-- TradingView Lightweight Charts CDN -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background-color: #131722; color: white; }
        #header { padding: 15px; background: #1e222d; text-align: center; font-size: 20px; font-weight: bold; }
        /* Chart එක පෙන්නන්න මේ Container එකට උසක් (Height) තිබීම අනිවාර්යයි */
        #chart-container { 
            width: 95%; 
            height: 600px; 
            margin: 20px auto; 
            border: 1px solid #363c4e;
            border-radius: 8px;
            overflow: hidden;
        }
        .status { text-align: center; color: #00ff00; font-size: 14px; }
    </style>
</head>
<body>

    <div id="header">SMC TRADING DASHBOARD (DERIV)</div>
    <div id="status" class="status">Connecting to Deriv...</div>
    <div id="chart-container"></div>

    <script>
        const chartContainer = document.getElementById('chart-container');
        const statusText = document.getElementById('status');

        // 1. Chart එක Initialize කිරීම (අලුත්ම Version එකට අනුව)
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                background: { color: '#131722' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2b2b43' },
                horzLines: { color: '#2b2b43' },
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#485c7b' },
            timeScale: { borderColor: '#485c7b', timeVisible: true, secondsVisible: true },
        });

        // Candlestick Series එක එකතු කිරීම
        const candleSeries = chart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350', 
            borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        // 2. Deriv WebSocket සම්බන්ධතාවය
        const app_id = 1089; // මූලික app_id එක
        const ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${app_id}`);

        const symbol = "1HZ100V"; // Volatility 100 (1s) Index

        ws.onopen = () => {
            statusText.innerText = `Connected to ${symbol}`;
            // ඉතිහාස දත්ත සහ Live Updates ලබා ගැනීමට Request එක
            ws.send(JSON.stringify({
                "ticks_history": symbol,
                "adjust_start_time": 1,
                "subscribe": 1,
                "end": "latest",
                "count": 500, // ඉටිපන්දම් 500ක් ගෙන්වා ගනී
                "style": "candles"
            }));
        };

        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);

            // මුලින්ම ලැබෙන Candle History එක Chart එකට දැමීම
            if (data.candles) {
                const historyData = data.candles.map(c => ({
                    time: c.epoch,
                    open: c.open,
                    high: c.high,
                    low: c.low,
                    close: c.close
                }));
                candleSeries.setData(historyData);
            }

            // Live අලුත් වන Candle එක update කිරීම
            if (data.ohlc) {
                candleSeries.update({
                    time: data.ohlc.open_time,
                    open: data.ohlc.open,
                    high: data.ohlc.high,
                    low: data.ohlc.low,
                    close: data.ohlc.close
                });
            }
        };

        ws.onerror = (err) => console.error("WS Error:", err);
        ws.onclose = () => statusText.innerText = "Connection Closed.";

        // Window එක resize කරන විට Chart එකත් resize වීම
        window.onresize = () => {
            chart.applyOptions({ width: chartContainer.clientWidth });
        };

    </script>
</body>
</html>
