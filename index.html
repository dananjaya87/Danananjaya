<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V6 PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
    :root {
        --bg: #05070A; --card: #0F172A; --border: #1E293B;
        --green: #00FF88; --red: #FF4D4D; --blue: #38BDF8; --text: #F8FAFC;
        --muted: #94A3B8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); 
        padding: 10px; overflow-x: hidden;
    }
    .container { width: 100%; max-width: 1400px; margin: auto; }
    
    .header { text-align: center; padding: 15px 0; }
    .title { 
        font-size: 24px; font-weight: 800; color: var(--green); 
        text-shadow: 0 0 10px rgba(0,255,136,0.3); letter-spacing: 1px;
    }

    /* Top Controls */
    .top-grid { 
        display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; 
    }
    .card { 
        background: var(--card); border: 1px solid var(--border); 
        border-radius: 12px; padding: 12px; 
    }
    .card h3 { font-size: 13px; color: var(--blue); margin-bottom: 8px; text-transform: uppercase; }

    select { 
        width: 100%; padding: 10px; background: #070E1A; color: white; 
        border: 1px solid #334155; border-radius: 8px; font-size: 14px; outline: none;
    }

    /* Chart Main Box */
    .chart-container { 
        width: 100%; height: 450px; background: var(--card); 
        border: 1px solid var(--border); border-radius: 15px; overflow: hidden;
        margin-bottom: 15px; position: relative;
    }
    #chart { width: 100%; height: 100%; }

    /* AI Signal Section Below Chart */
    .ai-section { 
        display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-bottom: 10px;
    }
    
    .led-group { display: flex; flex-direction: column; gap: 8px; }
    .led-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .led-dot { width: 10px; height: 10px; border-radius: 50%; background: #1e293b; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }
    .led-dot.on-blue { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    .led-dot.on-green { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .led-dot.on-red { background: var(--red); box-shadow: 0 0 8px var(--red); }

    #signal-box { 
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px dashed var(--border);
    }
    .sig-val { font-size: 28px; font-weight: 800; color: var(--muted); }
    .sig-str { font-size: 11px; color: var(--blue); margin-top: 4px; font-family: 'JetBrains Mono'; }

    /* Bottom Stats */
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .info-box { 
        background: var(--card); border: 1px solid var(--border); 
        border-radius: 12px; padding: 15px; text-align: center;
    }
    .info-title { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .info-value { font-size: 20px; font-weight: 700; }

    @media (max-width: 600px) {
        .chart-container { height: 350px; }
        .ai-section { grid-template-columns: 1fr; }
        .title { font-size: 18px; }
    }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>
    </div>

    <!-- Controls -->
    <div class="top-grid">
        <div class="card">
            <h3>MARKET</h3>
            <select id="market">
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>
                <option value="JD50">Jump 50</option>
            </select>
        </div>
        <div class="card">
            <h3>STATUS</h3>
            <div id="status" style="color:var(--green); font-size: 14px; font-weight: 600;">CONNECTING...</div>
            <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">Voice: <span style="color:var(--green)">ON</span></div>
        </div>
    </div>

    <!-- Main Chart -->
    <div class="chart-container">
        <div id="chart"></div>
    </div>

    <!-- AI Signal Logic Box -->
    <div class="ai-section">
        <div class="card">
            <h3>🔍 AI CONFLUENCE</h3>
            <div class="led-group">
                <div class="led-row">Key Level <div id="led-1" class="led-dot"></div></div>
                <div class="led-row">Momentum <div id="led-2" class="led-dot"></div></div>
                <div class="led-row">Hidden Open <div id="led-3" class="led-dot"></div></div>
                <div class="led-row">FVG Gap <div id="led-4" class="led-dot"></div></div>
            </div>
        </div>
        <div id="signal-box" class="card">
            <div class="sig-val" id="sig-val">WAIT</div>
            <div class="sig-str" id="sig-str">ANALYZING: 0%</div>
        </div>
    </div>

    <!-- Bottom Data -->
    <div class="bottom-grid">
        <div class="info-box">
            <div class="info-title">MARKET TREND</div>
            <div class="info-value" id="trend" style="color:var(--muted);">WAIT</div>
        </div>
        <div class="info-box">
            <div class="info-title">SMC SYSTEM</div>
            <div class="info-value" id="systemStatus" style="color:var(--blue);">READY</div>
        </div>
    </div>
</div>

<script>
const APP_ID = "1089";
let ws = null;
let chart, candleSeries, trendSeries;
let candles = [];
let currentMarket = "R_50";
let resLine = null, supLine = null;

function announce(text) {
    const msg = new SpeechSynthesisUtterance(text);
    window.speechSynthesis.speak(msg);
}

function initChart() {
    const chartElement = document.getElementById("chart");
    chart = LightweightCharts.createChart(chartElement, {
        layout: { background: { color: "#0F172A" }, textColor: "#94A3B8" },
        grid: { vertLines: { color: "#1E293B" }, horzLines: { color: "#1E293B" } },
        timeScale: { borderColor: "#334155", timeVisible: true, secondsVisible: false },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
    });
    candleSeries = chart.addCandlestickSeries({ 
        upColor: "#00FF88", downColor: "#FF4D4D", borderVisible: false, 
        wickUpColor: "#00FF88", wickDownColor: "#FF4D4D" 
    });
    trendSeries = chart.addLineSeries({ color: 'rgba(56, 189, 248, 0.3)', lineWidth: 1 });
    
    window.addEventListener('resize', () => {
        chart.applyOptions({ width: chartElement.clientWidth, height: chartElement.clientHeight });
    });
}

function runAI() {
    if (candles.length < 15) return;
    const curr = candles[candles.length - 1];
    const prev = candles[candles.length - 2];
    let score = 0;

    // Confluence Checks
    const atRes = resLine && Math.abs(curr.close - resLine.options().price) < (curr.high-curr.low);
    const atSup = supLine && Math.abs(curr.close - supLine.options().price) < (curr.high-curr.low);
    document.getElementById('led-1').className = (atRes || atSup) ? 'led-dot on-blue' : 'led-dot';
    if(atRes || atSup) score++;

    const mom = Math.abs(curr.close - candles[candles.length-4].close) > (curr.high-curr.low)*2;
    document.getElementById('led-2').className = mom ? 'led-dot on-blue' : 'led-dot';
    if(mom) score++;

    const isBig = Math.abs(curr.close - curr.open) > Math.abs(prev.close - prev.open)*1.5;
    document.getElementById('led-3').className = isBig ? 'led-dot on-blue' : 'led-dot';
    if(isBig) score++;

    const fvg = Math.abs(candles[candles.length-3].high - prev.low) > 0;
    document.getElementById('led-4').className = fvg ? 'led-dot on-blue' : 'led-dot';
    if(fvg) score++;

    let pct = Math.round((score/4)*100);
    document.getElementById('sig-str').innerText = `CONFIRMING: ${pct}%`;

    const bull = curr.close > curr.open && curr.close > prev.high && score >= 2;
    const bear = curr.close < curr.open && curr.close < prev.low && score >= 2;

    const val = document.getElementById('sig-val');
    if(bull) { 
        val.innerText = "BUY"; val.style.color = "var(--green)"; 
        if(window.lastT !== curr.time) { announce("Strong Buy Signal"); window.lastT = curr.time; }
    } else if(bear) { 
        val.innerText = "SELL"; val.style.color = "var(--red)"; 
        if(window.lastT !== curr.time) { announce("Strong Sell Signal"); window.lastT = curr.time; }
    } else { 
        val.innerText = "WAIT"; val.style.color = "var(--muted)"; 
    }
}

function updateSMC() {
    if (candles.length < 20) return;
    let markers = [];
    let high = candles[0].high, low = candles[0].low;
    
    candles.forEach(c => {
        if(c.high > high) high = c.high;
        if(c.low < low) low = c.low;
    });

    if(resLine) candleSeries.removePriceLine(resLine);
    if(supLine) candleSeries.removePriceLine(supLine);
    
    resLine = candleSeries.createPriceLine({ price: high, color: '#FF4D4D', lineWidth: 1, lineStyle: 2, title: 'RES' });
    supLine = candleSeries.createPriceLine({ price: low, color: '#00FF88', lineWidth: 1, lineStyle: 2, title: 'SUP' });

    const trend = candles[candles.length-1].close > candles[candles.length-10].close ? "UPTREND" : "DOWNTREND";
    document.getElementById('trend').innerText = trend;
    document.getElementById('trend').style.color = trend === "UPTREND" ? "var(--green)" : "var(--red)";
    
    runAI();
}

function connect() {
    if (ws) ws.close();
    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=" + APP_ID);
    ws.onopen = () => {
        document.getElementById("status").innerText = "ONLINE";
        ws.send(JSON.stringify({ ticks_history: currentMarket, count: 300, granularity: 60, style: "candles" }));
    };
    ws.onmessage = (msg) => {
        const res = JSON.parse(msg.data);
        if (res.candles) {
            candles = res.candles.map(c => ({ time: c.epoch, open: +c.open, high: +c.high, low: +c.low, close: +c.close }));
            candleSeries.setData(candles);
            updateSMC();
            ws.send(JSON.stringify({ ticks: currentMarket, subscribe: 1 }));
        }
        if (res.tick) {
            const last = candles[candles.length - 1];
            const price = +res.tick.quote;
            const time = Math.floor(res.tick.epoch / 60) * 60;
            if (time === last.time) {
                last.close = price; last.high = Math.max(last.high, price); last.low = Math.min(last.low, price);
            } else {
                const newC = { time, open: price, high: price, low: price, close: price };
                candles.push(newC); candles.shift();
            }
            candleSeries.update(candles[candles.length-1]);
            updateSMC();
        }
    };
}

document.getElementById("market").onchange = (e) => {
    currentMarket = e.target.value;
    connect();
};

initChart();
connect();
</script>
</body>
</html>
