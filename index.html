<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JANAKA SMC DASHBOARD V6 PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #05070A; --card: #111827; --border: #233044; --green: #00FF88; --red: #FF4D4D; --blue: #38BDF8; --text: #FFFFFF; --muted: #94A3B8; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; color: var(--text); padding: 16px; overflow-x: hidden; }
        .container { width: 100%; max-width: 1700px; margin: auto; }
        .title { font-size: 32px; font-weight: 800; text-align: center; letter-spacing: 2px; margin-bottom: 20px; color: var(--green); text-shadow: 0 0 8px rgba(0,255,136,.6); }
        .grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 18px; }
        .card { background: linear-gradient(180deg, #111827, #0B1220); border: 1px solid var(--border); border-radius: 20px; padding: 18px; box-shadow: 0 12px 25px rgba(0,0,0,.35); }
        .card h3 { font-size: 17px; font-weight: 700; color: var(--blue); margin-bottom: 14px; }
        select { width: 100%; height: 56px; background: #08111F; color: white; border: 1px solid #334155; border-radius: 14px; padding: 0 16px; font-size: 17px; outline: none; cursor: pointer; }
        .status { font-size: 17px; line-height: 34px; }
        .status span { font-weight: 700; color: var(--green); }
        #chart { width: 100%; height: 500px; border-radius: 16px; overflow: hidden; background: #0A1322; border: 1px solid var(--border); }
        .bottom-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; margin-top: 18px; }
        .info-box { background: linear-gradient(180deg, #111827, #0A1322); border: 1px solid var(--border); border-radius: 18px; padding: 22px; text-align: center; }
        .info-title { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
        .info-value { font-size: 30px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .green { color: var(--green); }
        .cyan { color: var(--blue); }
        .red { color: var(--red); }
        @media(max-width: 900px) { .grid-top { grid-template-columns: 1fr; } .bottom-grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>
        <div class="grid-top">
            <div class="card">
                <h3>📊 SELECT MARKET</h3>
                <select id="market">
                    <option value="R_10">Volatility 10</option>
                    <option value="R_25">Volatility 25</option>
                    <option value="R_50" selected>Volatility 50</option>
                    <option value="R_75">Volatility 75</option>
                    <option value="R_100">Volatility 100</option>
                    <option value="JD10">Jump 10</option>
                    <option value="JD25">Jump 25</option>
                    <option value="JD50">Jump 50</option>
                    <option value="JD75">Jump 75</option>
                    <option value="JD100">Jump 100</option>
                </select>
            </div>
            <div class="card">
                <h3>🌐 CONNECTION STATUS</h3>
                <div class="status">
                    Status : <span id="status">Connecting...</span><br>
                    Market : <span id="marketName">Volatility 50</span>
                </div>
            </div>
        </div>
        <div class="card">
            <div id="chart"></div>
        </div>
        <div class="bottom-grid">
            <div class="info-box">
                <div class="info-title">📈 MARKET TREND</div>
                <div class="info-value green" id="trend">WAIT</div>
            </div>
            <div class="info-box">
                <div class="info-title">⚡ SYSTEM STATUS</div>
                <div class="info-value cyan" id="systemStatus">READY</div>
            </div>
        </div>
    </div>

        });

            trendLabel.className = "info-value green";
        } else {

            trendLabel.className = "info-value red";
        }
    }
