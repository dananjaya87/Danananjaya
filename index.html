<style>

<body>

<div class="container">

    <div class="title">
        JANAKA SMC DASHBOARD V6 PRO
    </div>

    <div class="grid-top">

        <div class="card">

            <h3>📊 SELECT MARKET</h3>

            <select id="market">

                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>

                <option value="JD10">Jump 10</option>
                <option value="JD25">Jump 25</option>
                <option value="JD50">Jump 50</option>
                <option value="JD75">Jump 75</option>
                <option value="JD100">Jump 100</option>

                <option value="RDBEAR">Bear Market</option>
                <option value="RDBULL">Bull Market</option>

                <option value="frxEURUSD">EUR / USD</option>
                <option value="frxGBPUSD">GBP / USD</option>
                <option value="frxUSDJPY">USD / JPY</option>
                <option value="frxAUDUSD">AUD / USD</option>

            </select>

        </div>

        <div class="card">

            <h3>🌐 CONNECTION STATUS</h3>

            <div class="status">

                Status :
                <span id="status">
                    Connecting...
                </span>

                <br><br>

                Market :
                <span id="marketName">
                    Volatility 50
                </span>

            </div>

        </div>

    </div>

    <div class="card chart-card">

        <div class="chart-title">
            📈 LIVE MARKET CHART
        </div>

        <div id="chart"></div>
        <div id="rsi-chart"></div> <!-- New RSI Container -->

    </div>

    <div class="bottom-grid">

        <div class="info-box">

            <div class="info-title">
                📈 MARKET TREND
            </div>

            <div class="info-value green" id="trend">
                WAIT
            </div>

        </div>

        <div class="info-box">

            <div class="info-title">
                ⚡ SYSTEM STATUS
            </div>

            <div class="info-value cyan" id="systemStatus">
                READY
            </div>

        </div>

    </div>

</div>

    <script>

/*=========================================
            CONFIG
=========================================*/

const APP_ID = "1089";
const TIMEFRAME = 60;
const MAX_CANDLES = 300;


/*=========================================
        GLOBAL VARIABLES
=========================================*/

let ws = null;
let chart = null;
let candleSeries = null;
let trendSeries = null; 
let candles = [];
let currentMarket = "R_50";

// --- New Global Variables for S/R and Trendlines ---
let resistanceLine = null;
let supportLine = null;

// --- New Global Variables for RSI ---
let rsiChart = null;
let rsiSeries = null;


/*=========================================
            DOM
=========================================*/

const marketSelect = document.getElementById("market");
const marketName = document.getElementById("marketName");
const status = document.getElementById("status");
const trend = document.getElementById("trend");
const systemStatus = document.getElementById("systemStatus");
const chartContainer = document.getElementById("chart");
const rsiContainer = document.getElementById("rsi-chart");


/*=========================================
        RSI CALCULATION LOGIC
=========================================*/

function calculateRSIValues(data, period = 14) {
    let rsiData = [];
    if (data.length <= period) return rsiData;

    let gains = 0;
    let losses = 0;

    for (let i = 1; i <= period; i++) {
        let diff = data[i].close - data[i - 1].close;
        if (diff >= 0) gains += diff;
        else losses -= diff;
    }

    let avgGain = gains / period;
    let avgLoss = losses / period;

    for (let i = period + 1; i < data.length; i++) {
        let diff = data[i].close - data[i - 1].close;
        let gain = diff >= 0 ? diff : 0;
        let loss = diff < 0 ? -diff : 0;

        avgGain = (avgGain * (period - 1) + gain) / period;
        avgLoss = (avgLoss * (period - 1) + loss) / period;

        let rs = avgGain / avgLoss;
        let rsi = 100 - (100 / (1 + rs));
        rsiData.push({ time: data[i].time, value: rsi });
    }
    return rsiData;
}


/*=========================================
        SMC LOGIC (AUTOMATIC)
=========================================*/

function calculateSMC() {
    if (candles.length < 20) return;

    let markers = [];
    let swings = [];
    const windowSize = 4; // To find major swings

    // Update RSI
    const rsiValues = calculateRSIValues(candles);
    rsiSeries.setData(rsiValues);

    // Find Swing Highs & Lows
    for (let i = windowSize; i < candles.length - windowSize; i++) {
        let isHigh = true;
        let isLow = true;
        for (let j = 1; j <= windowSize; j++) {
            if (candles[i].high < candles[i-j].high || candles[i].high < candles[i+j].high) isHigh = false;
            if (candles[i].low > candles[i-j].low || candles[i].low > candles[i+j].low) isLow = false;
        }

        if (isHigh) swings.push({ type: 'H', price: candles[i].high, time: candles[i].time });
        if (isLow) swings.push({ type: 'L', price: candles[i].low, time: candles[i].time });
    }

    if (swings.length < 3) return;

    let lastH = null, lastL = null;
    let currentDir = ""; 
    let lineData = [];

    swings.forEach((s, idx) => {
        let label = "";
        let color = "#FFFFFF";

        if (s.type === 'H') {
            if (lastH && s.price > lastH.price) {
                label = "HH"; color = "#00FF88";
                // BOS
                markers.push({ time: s.time, position: 'aboveBar', color: '#FFD700', shape: 'arrowDown', text: 'BOS' });
                currentDir = "UPTREND";
            } else if (lastH && s.price < lastH.price) {
                label = "LH"; color = "#FF4D4D";
                // Potential CHOCH if it was uptrend
                if(currentDir === "UPTREND") markers.push({ time: s.time, position: 'aboveBar', color: '#FF00FF', shape: 'arrowDown', text: 'CHOCH' });
                currentDir = "DOWNTREND";
            }
            lastH = s;
        } else {
            if (lastL && s.price < lastL.price) {
                label = "LL"; color = "#FF4D4D";
                markers.push({ time: s.time, position: 'belowBar', color: '#FFD700', shape: 'arrowUp', text: 'BOS' });
            } else if (lastL && s.price > lastL.price) {
                label = "HL"; color = "#00FF88";
                if(currentDir === "DOWNTREND") markers.push({ time: s.time, position: 'belowBar', color: '#FF00FF', shape: 'arrowUp', text: 'CHOCH' });
            }
            lastL = s;
        }

        if (label !== "") {
            markers.push({
                time: s.time,
                position: s.type === 'H' ? 'aboveBar' : 'belowBar',
                color: color,
                shape: 'text',
                text: label
            });
        }
        lineData.push({ time: s.time, value: s.price });
    });

    candleSeries.setMarkers(markers);
    trendSeries.setData(lineData);
    trend.innerText = currentDir || "ANALYZING";
    trend.style.color = currentDir === "UPTREND" ? "#00FF88" : "#FF4D4D";

    // --- NEW AUTO S/R & TRENDLINE LOGIC (Added without changing original) ---
    
    // Clear old horizontal lines
    if (resistanceLine) candleSeries.removePriceLine(resistanceLine);
    if (supportLine) candleSeries.removePriceLine(supportLine);

    const highSwings = swings.filter(s => s.type === 'H');
    const lowSwings = swings.filter(s => s.type === 'L');

    if (highSwings.length >= 2) {
        const lastHigh = highSwings[highSwings.length - 1];
        
        // Add Horizontal Resistance
        resistanceLine = candleSeries.createPriceLine({
            price: lastHigh.price,
            color: '#FF4D4D',
            lineWidth: 2,
            lineStyle: 0, // Solid
            axisLabelVisible: true,
            title: 'RESISTANCE',
        });
    }

    if (lowSwings.length >= 2) {
        const lastLow = lowSwings[lowSwings.length - 1];

        // Add Horizontal Support
        supportLine = candleSeries.createPriceLine({
            price: lastLow.price,
            color: '#00FF88',
            lineWidth: 2,
            lineStyle: 0, // Solid
            axisLabelVisible: true,
            title: 'SUPPORT',
        });
    }
}


/*=========================================
        CREATE CHART
=========================================*/

function createChart(){

chart = LightweightCharts.createChart(chartContainer,{
layout:{
background:{ color:"#05070A" },
textColor:"#E5E7EB"
},
grid:{
vertLines:{ color:"#162033" },
horzLines:{ color:"#162033" }
},
rightPriceScale:{ borderColor:"#253244" },
timeScale:{ borderColor:"#253244", timeVisible:true, secondsVisible:false },
crosshair:{ mode:1 },
width:chartContainer.clientWidth,
height:450
});

candleSeries = chart.addCandlestickSeries({
upColor:"#00FF88",
downColor:"#FF4D4D",
borderUpColor:"#00FF88",
borderDownColor:"#FF4D4D",
wickUpColor:"#00FF88",
wickDownColor:"#FF4D4D"
});

// For Trendlines (Original Zig-Zag)
trendSeries = chart.addLineSeries({
    color: 'rgba(56, 189, 248, 0.4)',
    lineWidth: 1,
    lineStyle: 2,
});

/* --- CREATE RSI CHART --- */
rsiChart = LightweightCharts.createChart(rsiContainer, {
    layout: {
        background: { color: "#05070A" },
        textColor: "#E5E7EB"
    },
    grid: {
        vertLines: { color: "#162033" },
        horzLines: { color: "#162033" }
    },
    rightPriceScale: { 
        borderColor: "#253244",
        minValue: 0,
        maxValue: 100,
    },
    timeScale: { visible: false }, // Hide time scale on RSI to keep it clean
    width: rsiContainer.clientWidth,
    height: 150
});

rsiSeries = rsiChart.addLineSeries({
    color: '#FF00FF',
    lineWidth: 2,
    title: 'RSI (14)'
});

// Add RSI 70/30 levels
rsiSeries.createPriceLine({ price: 70, color: '#FF4D4D', lineWidth: 1, lineStyle: 2, title: '70' });
rsiSeries.createPriceLine({ price: 30, color: '#00FF88', lineWidth: 1, lineStyle: 2, title: '30' });

// SYNC CHARTS
chart.timeScale().subscribeVisibleTimeRangeChange(range => {
    rsiChart.timeScale().setVisibleRange(range);
});

rsiChart.timeScale().subscribeVisibleTimeRangeChange(range => {
    chart.timeScale().setVisibleRange(range);
});


window.addEventListener("resize",()=>{
    chart.applyOptions({ width:chartContainer.clientWidth });
    rsiChart.applyOptions({ width:rsiContainer.clientWidth });
});
}


/*=========================================
        START APP
=========================================*/

createChart();
status.innerHTML="READY";
systemStatus.innerHTML="INITIALIZED";
marketName.innerHTML="Volatility 50";
    
        
/*=========================================
        CONNECT TO DERIV
=========================================*/

function connectDeriv() {
    status.innerHTML = "CONNECTING...";
    systemStatus.innerHTML = "LOADING";

    if (ws) {
        ws.close();
    }

    ws = new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");

    ws.onopen = () => {
        status.innerHTML = "ONLINE";
        ws.send(JSON.stringify({
            ticks_history: currentMarket,
            adjust_start_time: 1,
            count: 300,
            end: "latest",
            granularity: TIMEFRAME,
            style: "candles"
        }));
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);

        if (data.candles) {
            candles = data.candles.map(c => ({
                time: Number(c.epoch),
                open: Number(c.open),
                high: Number(c.high),
                low: Number(c.low),
                close: Number(c.close)
            }));

            candleSeries.setData(candles);
            calculateSMC();
            systemStatus.innerHTML = "LIVE";

            ws.send(JSON.stringify({
                ticks: currentMarket,
                subscribe: 1
            }));
        }

        if (data.tick) {
            let price = Number(data.tick.quote);
            let epoch = Number(data.tick.epoch);
            let candleTime = Math.floor(epoch / TIMEFRAME) * TIMEFRAME;

            if (candles.length === 0) return;

            let lastCandle = candles[candles.length - 1];

            if (candleTime === lastCandle.time) {
                lastCandle.close = price;
                if (price > lastCandle.high) lastCandle.high = price;
                if (price < lastCandle.low) lastCandle.low = price;
                candleSeries.update(lastCandle);
            } else {
                let newCandle = {
                    time: candleTime,
                    open: price,
                    high: price,
                    low: price,
                    close: price
                };
                candles.push(newCandle);
                if (candles.length > 300) candles.shift();
                candleSeries.update(newCandle);
                calculateSMC();
            }
            
            // Real-time RSI update call
            const rsiValues = calculateRSIValues(candles);
            rsiSeries.setData(rsiValues);
        }
    };

    ws.onclose = () => {
        status.innerHTML = "OFFLINE";
       setTimeout(connectDeriv, 2000);
    };
}

marketSelect.addEventListener("change", () => {
    currentMarket = marketSelect.value;
    marketName.innerHTML = marketSelect.options[marketSelect.selectedIndex].text;
    candles = [];
    connectDeriv();
});
    
connectDeriv();
</script>
