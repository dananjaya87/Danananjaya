<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JANAKA SMC DASHBOARD V6 PRO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--bg:#05070A;
--card:#111827;
--card2:#0F172A;
--border:#233044;
--green:#00FF88;
--red:#FF4D4D;
--blue:#38BDF8;
--text:#FFFFFF;
--muted:#94A3B8;
}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);padding:16px;overflow-x:hidden;}
.container{width:100%;max-width:1700px;margin:auto;}
.title{font-size:32px;font-weight:800;text-align:center;letter-spacing:2px;margin-bottom:20px;color:var(--green);text-shadow:0 0 8px rgba(0,255,136,.6),0 0 25px rgba(0,255,136,.25);}
.grid-top{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px;}
.card{background:linear-gradient(180deg,#111827,#0B1220);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 12px 25px rgba(0,0,0,.35);}
.card h3{font-size:17px;font-weight:700;color:var(--blue);margin-bottom:14px;letter-spacing:.5px;}
select{width:100%;height:56px;background:#08111F;color:white;border:1px solid #334155;border-radius:14px;padding:0 16px;font-size:17px;outline:none;transition:.25s;}
select:focus{border-color:var(--green);box-shadow:0 0 12px rgba(0,255,136,.3);}
.status{font-size:17px;line-height:34px;}
.status span{font-weight:700;color:var(--green);}
.chart-card{padding:14px;}
.chart-title{font-size:18px;font-weight:700;color:var(--blue);margin-bottom:12px;}
#chart{width:100%;height:560px;border-radius:16px;overflow:hidden;background:#0A1322;border:1px solid var(--border); position: relative;}
.bottom-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px;}
.info-box{background:linear-gradient(180deg,#111827,#0A1322);border:1px solid var(--border);border-radius:18px;padding:22px;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.35);}
.info-title{font-size:14px;font-weight:600;letter-spacing:1px;color:var(--muted);margin-bottom:12px;}
.info-value{font-size:30px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.green{color:var(--green);}
.cyan{color:var(--blue);}
.red{color:var(--red);}
@media(max-width:900px){.title{font-size:26px;}.grid-top{grid-template-columns:1fr;}.bottom-grid{grid-template-columns:1fr 1fr;}#chart{height:520px;}}
</style>
</head>

<body>
<div class="container">
    <div class="title">JANAKA SMC DASHBOARD V6 PRO</div>
    <div class="grid-top">
        <div class="card">
            <h3>📊 SELECT MARKET</h3>
            <select id="market">
                <option value="R_10">Volatility 10</option>
                <option value="R_25">Volatility 25</option>
                <option value="R_50" selected>Volatility 50</option>
                <option value="R_75">Volatility 75</option>
                <option value="R_100">Volatility 100</option>
                <option value="1HZ10V">Volatility 10 (1s)</option>
                <option value="1HZ100V">Volatility 100 (1s)</option>
                <option value="JD10">Jump 10</option>
                <option value="JD25">Jump 25</option>
                <option value="JD50">Jump 50</option>
                <option value="JD75">Jump 75</option>
                <option value="JD100">Jump 100</option>
                <option value="frxEURUSD">EUR / USD</option>
                <option value="frxGBPUSD">GBP / USD</option>
                <option value="frxUSDJPY">USD / JPY</option>
            </select>
        </div>
        <div class="card">
            <h3>🌐 CONNECTION STATUS</h3>
            <div class="status">
                Status : <span id="status">Connecting...</span><br>
                Market : <span id="marketName">Volatility 50</span>
            </div>
        </div>
    </div>
    <div class="card chart-card">
        <div class="chart-title">📈 LIVE MARKET CHART</div>
        <div id="chart"></div>
    </div>
    <div class="bottom-grid">
        <div class="info-box">
            <div class="info-title">📈 MARKET TREND</div>
            <div class="info-value green" id="trend">STABLE</div>
        </div>
        <div class="info-box">
            <div class="info-title">⚡ SYSTEM STATUS</div>
            <div class="info-value cyan" id="systemStatus">READY</div>
        </div>
    </div>
</div>

<script>
/*=========================================
            CONFIG
=========================================*/
const APP_ID = "1089";
const TIMEFRAME = 60; // 1 Minute
let ws = null;
let chart = null;
let candleSeries = null;
let currentMarket = "R_50";

const marketSelect = document.getElementById("market");
const marketName = document.getElementById("marketName");
const status = document.getElementById("status");
const systemStatus = document.getElementById("systemStatus");
const chartContainer = document.getElementById("chart");

/*=========================================
        CHART INITIALIZATION
=========================================*/
function initChart() {
    if (chart) {
        chart.remove();
    }

    chart = LightweightCharts.createChart(chartContainer, {
        layout: { 
            background: { color: "#0A1322" }, 
            textColor: "#94A3B8" 
        },
        grid: { 
            vertLines: { color: "#1E293B" }, 
            horzLines: { color: "#1E293B" } 
        },
        rightPriceScale: { borderColor: "#334155" },
        timeScale: { 
            borderColor: "#334155", 
            timeVisible: true, 
            secondsVisible: false 
        },
        crosshair: { mode: 0 },
        width: chartContainer.clientWidth,
        height: 560
    });

    candleSeries = chart.addCandlestickSeries({
        upColor: "#00FF88", 
        downColor: "#FF4D4D",
        borderUpColor: "#00FF88", 
        borderDownColor: "#FF4D4D",
        wickUpColor: "#00FF88", 
        wickDownColor: "#FF4D4D"
    });

    // Resize handler
    window.addEventListener("resize", () => {
        chart.applyOptions({ width: chartContainer.clientWidth });
    });
}

/*=========================================
        WEB SOCKET CONNECTION
=========================================*/
function connectDeriv() {
    if (ws) {
        ws.close();
    }

    ws = new WebSocket(`wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`);

    ws.onopen = () => {
        status.innerHTML = "ONLINE";
        status.style.color = "var(--green)";
        
        // Request history and subscription
        ws.send(JSON.stringify({
            ticks_history: currentMarket,
            adjust_start_time: 1,
            count: 500,
            end: "latest",
            granularity: TIMEFRAME,
            style: "candles",
            subscribe: 1
        }));
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);

        // Handle Historical Data
        if (data.candles) {
            const history = data.candles.map(c => ({
                time: parseInt(c.epoch),
                open: parseFloat(c.open),
                high: parseFloat(c.high),
                low: parseFloat(c.low),
                close: parseFloat(c.close)
            }));
            candleSeries.setData(history);
            systemStatus.innerHTML = "LIVE";
        }

        // Handle Live Updates
        if (data.ohlc) {
            const candle = data.ohlc;
            candleSeries.update({
                time: parseInt(candle.open_time),
                open: parseFloat(candle.open),
                high: parseFloat(candle.high),
                low: parseFloat(candle.low),
                close: parseFloat(candle.close)
            });

            // Trend indicator logic
            updateTrend(data.ohlc);
        }

        // Keep connection alive (Ping)
        if (data.msg_type === "ping") {
            ws.send(JSON.stringify({ ping: 1 }));
        }
    };

    ws.onclose = () => {
        status.innerHTML = "OFFLINE";
        status.style.color = "var(--red)";
        setTimeout(connectDeriv, 3000); // Reconnect loop
    };

    ws.onerror = () => {
        status.innerHTML = "ERROR";
    };
}

function updateTrend(ohlc) {
    const trendEl = document.getElementById("trend");
    if (ohlc.close > ohlc.open) {
        trendEl.innerHTML = "BULLISH";
        trendEl.className = "info-value green";
    } else {
        trendEl.innerHTML = "BEARISH";
        trendEl.className = "info-value red";
    }
}

/*=========================================
        EVENTS
=========================================*/
marketSelect.addEventListener("change", (e) => {
    currentMarket = e.target.value;
    marketName.innerHTML = marketSelect.options[marketSelect.selectedIndex].text;
    
    systemStatus.innerHTML = "SWITCHING...";
    candleSeries.setData([]); // Clear chart
    connectDeriv();
});

// START
initChart();
connectDeriv();

// Ping every 30 seconds to keep connection alive
setInterval(() => {
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ ping: 1 }));
    }
}, 30000);

</script>
</body>
</html>
